[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-migration-fmt"
version = "0.1.0"
description = "A strict-by-default formatter for SQL migration files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pallen41" }]

[project.scripts]
sql-migration-fmt = "sql_migration_fmt.cli:main"

[tool.setuptools.packages.find]
include = ["sql_migration_fmt*"]
